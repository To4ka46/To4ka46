
services:
  web:
    build: .
    command: python manage.py migrate && python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=funds_api.settings
    depends_on:
      - db

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: funds_db
      POSTGRES_USER: funds_user
      POSTGRES_PASSWORD: funds_pass
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
  media_volume:
